<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>新增活動｜活動報名平台</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header><div class="inner"><a class="site-name" href="index.html">活動報名平台</a><a class="button" href="create.html">新增活動</a></div></header>
  <main>
    <h1>新增活動</h1>
    <div id="message" class="message" hidden></div>
    <form id="create-form" class="panel">
      <div class="field">
        <label for="title">活動名稱</label>
        <input id="title" name="title" required maxlength="100">
      </div>
      <div class="field">
        <label for="description">活動說明</label>
        <textarea id="description" name="description" maxlength="1000"></textarea>
      </div>
      <div class="field">
        <label for="location">地點</label>
        <input id="location" name="location" maxlength="100">
      </div>
      <div class="row">
        <div class="field">
          <label for="event_time">活動時間</label>
          <input id="event_time" name="event_time" type="datetime-local" required>
        </div>
        <div class="field">
          <label for="deadline">報名截止</label>
          <input id="deadline" name="deadline" type="datetime-local" required>
        </div>
      </div>
      <div class="field">
        <label for="capacity">名額上限</label>
        <input id="capacity" name="capacity" type="number" min="1">
        <span class="hint">留空表示不限名額</span>
      </div>
      <button type="submit">建立活動</button>
    </form>
  </main>
  <script src="js/api.js"></script>
  <script src="js/create.js"></script>
</body>
</html>
