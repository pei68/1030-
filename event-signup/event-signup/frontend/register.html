<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>報名表｜活動報名平台</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header><div class="inner"><a class="site-name" href="index.html">活動報名平台</a><a class="button" href="create.html">新增活動</a></div></header>
  <main>
    <h1>報名表</h1>
    <section id="activity-info" class="panel"></section>
    <div id="message" class="message" hidden></div>
    <form id="register-form" class="panel">
      <div class="field">
        <label for="name">姓名</label>
        <input id="name" name="name" required maxlength="50" autocomplete="name">
      </div>
      <div class="field">
        <label for="phone">連絡電話</label>
        <input id="phone" name="phone" type="tel" required placeholder="0912345678" autocomplete="tel">
      </div>
      <button type="submit">送出報名</button>
    </form>
    <p><a href="index.html">回活動清單</a></p>
  </main>
  <script src="js/api.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
